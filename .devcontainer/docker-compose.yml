version: "3.8"

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    ports:
      - "8501:8501"   # Streamlit
      - "8888:8888"   # JupyterLab
    environment:
      - PYTHONPATH=/workspace
      - LANG=en_US.UTF-8
    stdin_open: true
    tty: true
    command: sleep infinity   # keeps container alive for VSCode to attach
